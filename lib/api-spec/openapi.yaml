openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: store
    description: Public storefront and demo checkout
  - name: admin
    description: Protected store management
paths:
  /access-status:
    get:
      operationId: getAccessStatus
      tags: [store]
      summary: Check regional access before showing the store
      responses:
        "200":
          description: Visitor may access the store
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionalAccess"
        "403":
          description: Store unavailable in the visitor's region
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionalAccess"
        "503":
          description: Visitor location could not be checked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RegionalAccess"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /storefront:
    get:
      operationId: getStorefront
      tags: [store]
      responses:
        "200":
          description: Published store settings and active products
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Storefront"
  /demo-orders:
    post:
      operationId: createDemoOrder
      tags: [store]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoOrderInput"
      responses:
        "201":
          description: Simulated order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoOrder"
  /demo-orders/{id}/verification:
    post:
      operationId: checkDemoOrderVerification
      tags: [store]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoVerificationCheck"
      responses:
        "200":
          description: State of the no-charge verification simulation
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoVerification"
  /demo-orders/{id}/cancel:
    post:
      operationId: cancelDemoOrder
      tags: [store]
      summary: Cancel a pending simulated order and return to checkout
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoVerificationCheck"
      responses:
        "200":
          description: Order cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoVerification"
  /demo-orders/{id}/verification-method:
    post:
      operationId: chooseDemoVerificationMethod
      tags: [store]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoVerificationMethodInput"
      responses:
        "200":
          description: Code delivery method selected; the code is supplied separately by the team
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoVerification"
  /demo-orders/{id}/verification-code:
    post:
      operationId: submitDemoVerificationCode
      tags: [store]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoVerificationCodeInput"
      responses:
        "200":
          description: Shopper code received for manual admin review
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoVerification"
  /demo-drafts/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    put:
      operationId: saveDemoDraft
      tags: [store]
      summary: Save a live, non-payment demo checkout draft
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DemoCheckoutDraftInput"
      responses:
        "200":
          description: Draft saved (no card number, expiry, or CVC values)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoCheckoutDraft"
  /delivery-alerts:
    post:
      operationId: sendDeliveryAlert
      tags: [store]
      summary: Notify the store when delivery entry begins
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeliveryAlertInput"
      responses:
        "202":
          description: Notification accepted or suppressed by alert limits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeliveryAlertResult"
        "503":
          description: Notification service unavailable
  /admin/me:
    get:
      operationId: getAdminMe
      tags: [admin]
      responses:
        "200":
          description: Approved admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminIdentity"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      responses:
        "200":
          description: Store activity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
  /admin/products:
    get:
      operationId: listAdminProducts
      tags: [admin]
      responses:
        "200":
          description: All products, including hidden ones
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Product"
    post:
      operationId: createAdminProduct
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductInput"
      responses:
        "201":
          description: Product created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
  /admin/product-images/upload-url:
    post:
      operationId: createAdminProductImageUploadUrl
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductImageUploadInput"
      responses:
        "200":
          description: Presigned upload URL and public application object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductImageUpload"
  /storage/objects/uploads/{id}:
    get:
      operationId: getProductImageObject
      tags: [store]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: Product image
          content:
            image/jpeg:
              schema: { type: string, format: binary }
            image/png:
              schema: { type: string, format: binary }
            image/webp:
              schema: { type: string, format: binary }
  /admin/products/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateAdminProduct
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProductUpdate"
      responses:
        "200":
          description: Product updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Product"
    delete:
      operationId: deleteAdminProduct
      tags: [admin]
      responses:
        "204":
          description: Product removed
  /admin/settings:
    get:
      operationId: getAdminSettings
      tags: [admin]
      responses:
        "200":
          description: Storefront settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStoreSettings"
    put:
      operationId: updateAdminSettings
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreSettingsInput"
      responses:
        "200":
          description: Saved settings
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminStoreSettings"
  /admin/orders:
    get:
      operationId: listAdminOrders
      tags: [admin]
      responses:
        "200":
          description: Simulated orders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoOrder"
  /admin/demo-drafts:
    get:
      operationId: listAdminDemoDrafts
      tags: [admin]
      responses:
        "200":
          description: Active demo checkout drafts; card fields are only completion flags
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DemoCheckoutDraft"
  /admin/orders/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
    patch:
      operationId: updateAdminOrder
      tags: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OrderStatusInput"
      responses:
        "200":
          description: Simulated order updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoOrder"
    delete:
      operationId: deleteAdminOrder
      tags: [admin]
      responses:
        "204":
          description: Simulated order deleted
  /admin/orders/{id}/request-verification:
    post:
      operationId: requestAdminOrderVerification
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Shopper can now view the no-charge verification step
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoOrder"
  /admin/orders/{id}/confirm-code-shared:
    post:
      operationId: confirmAdminCodeShared
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Admin confirms the team shared a code externally; shopper can now enter it
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoOrder"
  /admin/orders/{id}/decline-payment:
    post:
      operationId: declineAdminOrderPayment
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Shopper is returned to the card form with a simulated decline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoOrder"
  /admin/orders/{id}/approve-verification:
    post:
      operationId: approveAdminOrderVerification
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Shopper can continue after entering the test code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoOrder"
  /admin/orders/{id}/invalid-otp:
    post:
      operationId: markAdminOrderInvalidOtp
      tags: [admin]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        "200":
          description: Submitted code rejected; shopper may enter a new code
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DemoOrder"
components:
  schemas:
    RegionalAccess:
      type: object
      required: [allowed, country, code, message]
      properties:
        allowed: { type: boolean }
        country: { type: ["string", "null"] }
        code: { type: string, enum: [ALLOWED, REGION_BLOCKED, LOCATION_UNAVAILABLE] }
        message: { type: string }
    DeliveryAlertInput:
      type: object
      additionalProperties: false
      required: [draftId]
      properties:
        draftId: { type: string, format: uuid }
    DeliveryAlertResult:
      type: object
      required: [accepted]
      properties:
        accepted: { type: boolean }
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AdminIdentity:
      type: object
      required: [isAdmin]
      properties:
        isAdmin: { type: boolean }
    AdminOverview:
      type: object
      required: [productCount, activeProductCount, totalOrders, simulatedRevenueCents]
      properties:
        productCount: { type: integer }
        activeProductCount: { type: integer }
        totalOrders: { type: integer }
        simulatedRevenueCents: { type: integer }
    Product:
      type: object
      required: [id, slug, name, description, imageUrl, imageUrls, priceCents, stock, category, featured, active]
      properties:
        id: { type: integer }
        slug: { type: string }
        name: { type: string }
        description: { type: string }
        imageUrl: { type: string }
        imageUrls:
          type: array
          maxItems: 15
          items: { type: string, maxLength: 2048 }
        priceCents: { type: integer }
        stock: { type: integer }
        category: { type: string, minLength: 1, maxLength: 80, pattern: "\\S" }
        featured: { type: boolean }
        active: { type: boolean }
    ProductInput:
      type: object
      additionalProperties: false
      required: [slug, name, description, imageUrl, priceCents, stock, category, featured, active]
      properties:
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 3000 }
        imageUrl: { type: string, maxLength: 2048 }
        imageUrls:
          type: array
          maxItems: 15
          items: { type: string, maxLength: 2048 }
        priceCents: { type: integer, minimum: 0, maximum: 100000000 }
        stock: { type: integer, minimum: 0 }
        category: { type: string, minLength: 1, maxLength: 80, pattern: "\\S" }
        featured: { type: boolean }
        active: { type: boolean }
    ProductUpdate:
      type: object
      additionalProperties: false
      properties:
        slug: { type: string, pattern: "^[a-z0-9]+(?:-[a-z0-9]+)*$", maxLength: 100 }
        name: { type: string, minLength: 1, maxLength: 150 }
        description: { type: string, maxLength: 3000 }
        imageUrl: { type: string, maxLength: 2048 }
        imageUrls:
          type: array
          maxItems: 15
          items: { type: string, maxLength: 2048 }
        priceCents: { type: integer, minimum: 0, maximum: 100000000 }
        stock: { type: integer, minimum: 0 }
        category: { type: string, minLength: 1, maxLength: 80, pattern: "\\S" }
        featured: { type: boolean }
        active: { type: boolean }
    ProductImageUploadInput:
      type: object
      additionalProperties: false
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1, maxLength: 255 }
        size: { type: integer, minimum: 1, maximum: 10485760 }
        contentType: { type: string, enum: [image/jpeg, image/png, image/webp] }
    ProductImageUpload:
      type: object
      required: [uploadURL, objectPath]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
    StoreSettings:
      type: object
      required: [shippingCountries, brandName, announcement, heroTitle, heroDescription, heroImageUrl, trustTitle, trustDescription, shippingThresholdCents, shippingCents, supportEmail, fictionalDemoMode, verificationTitle, verificationMerchantName, verificationCountry, verificationPrompt, verificationEmailLabel, verificationPhoneLabel, verificationNextLabel, verificationAccentColor, verificationButtonColor]
      properties:
        brandName: { type: string }
        announcement: { type: string }
        heroTitle: { type: string }
        heroDescription: { type: string }
        heroImageUrl: { type: string }
        trustTitle: { type: string }
        trustDescription: { type: string }
        shippingThresholdCents: { type: integer }
        shippingCents: { type: integer }
        supportEmail: { type: string }
        shippingCountries:
          type: array
          minItems: 1
          uniqueItems: true
          items: { $ref: "#/components/schemas/CountryCode" }
        disabledCategories:
          type: array
          items: { type: string, minLength: 1, maxLength: 80 }
        fictionalDemoMode: { type: boolean }
        verificationTitle: { type: string }
        verificationMerchantName: { type: string }
        verificationCountry: { type: string }
        verificationPrompt: { type: string }
        verificationEmailLabel: { type: string }
        verificationPhoneLabel: { type: string }
        verificationNextLabel: { type: string }
        verificationAccentColor: { type: string }
        verificationButtonColor: { type: string }
    AdminStoreSettings:
      allOf:
        - $ref: "#/components/schemas/StoreSettings"
        - type: object
          required: [orderEmailsEnabled, orderEmailFrom, orderEmailTeam]
          properties:
            orderEmailsEnabled: { type: boolean }
            orderEmailFrom: { type: string }
            orderEmailTeam: { type: string }
    StoreSettingsInput:
      type: object
      additionalProperties: false
      required: [brandName, announcement, heroTitle, heroDescription, heroImageUrl, trustTitle, trustDescription, shippingThresholdCents, shippingCents, supportEmail, fictionalDemoMode, verificationTitle, verificationMerchantName, verificationCountry, verificationPrompt, verificationEmailLabel, verificationPhoneLabel, verificationNextLabel, verificationAccentColor, verificationButtonColor]
      properties:
        brandName: { type: string, minLength: 1, maxLength: 80 }
        announcement: { type: string, maxLength: 180 }
        heroTitle: { type: string, minLength: 1, maxLength: 130 }
        heroDescription: { type: string, maxLength: 500 }
        heroImageUrl: { type: string, maxLength: 2048 }
        trustTitle: { type: string, maxLength: 130 }
        trustDescription: { type: string, maxLength: 500 }
        shippingThresholdCents: { type: integer, minimum: 0, maximum: 100000000 }
        shippingCents: { type: integer, minimum: 0, maximum: 10000000 }
        supportEmail: { type: string, maxLength: 254 }
        shippingCountries:
          type: array
          minItems: 1
          maxItems: 249
          uniqueItems: true
          items: { $ref: "#/components/schemas/CountryCode" }
        disabledCategories:
          type: array
          maxItems: 1000
          items: { type: string, minLength: 1, maxLength: 80 }
        orderEmailsEnabled: { type: boolean }
        orderEmailFrom: { type: string, maxLength: 254 }
        orderEmailTeam: { type: string, maxLength: 254 }
        fictionalDemoMode: { type: boolean }
        verificationTitle: { type: string, minLength: 1, maxLength: 80 }
        verificationMerchantName: { type: string, minLength: 1, maxLength: 80 }
        verificationCountry: { type: string, maxLength: 80 }
        verificationPrompt: { type: string, minLength: 1, maxLength: 120 }
        verificationEmailLabel: { type: string, minLength: 1, maxLength: 40 }
        verificationPhoneLabel: { type: string, minLength: 1, maxLength: 40 }
        verificationNextLabel: { type: string, minLength: 1, maxLength: 40 }
        verificationAccentColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
        verificationButtonColor: { type: string, pattern: "^#[0-9a-fA-F]{6}$" }
    Storefront:
      type: object
      required: [settings, products]
      properties:
        settings:
          $ref: "#/components/schemas/StoreSettings"
        products:
          type: array
          items:
            $ref: "#/components/schemas/Product"
    OrderItem:
      type: object
      required: [productId, name, unitPriceCents, quantity]
      properties:
        productId: { type: integer }
        name: { type: string }
        unitPriceCents: { type: integer }
        quantity: { type: integer }
    CountryCode:
      type: string
      description: ISO 3166-1 alpha-2 country and territory code.
      enum: [AD, AE, AF, AG, AI, AL, AM, AO, AQ, AR, AS, AT, AU, AW, AX, AZ, BA, BB, BD, BE, BF, BG, BH, BI, BJ, BL, BM, BN, BO, BQ, BR, BS, BT, BV, BW, BY, BZ, CA, CC, CD, CF, CG, CH, CI, CK, CL, CM, CN, CO, CR, CU, CV, CW, CX, CY, CZ, DE, DJ, DK, DM, DO, DZ, EC, EE, EG, EH, ER, ES, ET, FI, FJ, FK, FM, FO, FR, GA, GB, GD, GE, GF, GG, GH, GI, GL, GM, GN, GP, GQ, GR, GS, GT, GU, GW, GY, HK, HM, HN, HR, HT, HU, ID, IE, IL, IM, IN, IO, IQ, IR, IS, IT, JE, JM, JO, JP, KE, KG, KH, KI, KM, KN, KP, KR, KW, KY, KZ, LA, LB, LC, LI, LK, LR, LS, LT, LU, LV, LY, MA, MC, MD, ME, MF, MG, MH, MK, ML, MM, MN, MO, MP, MQ, MR, MS, MT, MU, MV, MW, MX, MY, MZ, NA, NC, NE, NF, NG, NI, NL, NO, NP, NR, NU, NZ, OM, PA, PE, PF, PG, PH, PK, PL, PM, PN, PR, PS, PT, PW, PY, QA, RE, RO, RS, RU, RW, SA, SB, SC, SD, SE, SG, SH, SI, SJ, SK, SL, SM, SN, SO, SR, SS, ST, SV, SX, SY, SZ, TC, TD, TF, TG, TH, TJ, TK, TL, TM, TN, TO, TR, TT, TV, TW, TZ, UA, UG, UM, US, UY, UZ, VA, VC, VE, VG, VI, VN, VU, WF, WS, YE, YT, ZA, ZM, ZW]
    OrderAddress:
      type: object
      additionalProperties: false
      required: [fullName, line1, line2, city, region, postalCode, country]
      properties:
        fullName: { type: string, minLength: 1, maxLength: 100 }
        line1: { type: string, minLength: 1, maxLength: 150 }
        line2: { type: string, maxLength: 150 }
        city: { type: string, minLength: 1, maxLength: 100 }
        region: { type: string, maxLength: 80 }
        postalCode: { type: string, maxLength: 20 }
        country: { $ref: "#/components/schemas/CountryCode" }
    DemoOrder:
      type: object
      required: [id, createdAt, status, cardType, subtotalCents, shippingCents, totalCents, items]
      properties:
        id: { type: integer }
        createdAt: { type: string, format: date-time }
        status: { type: string, enum: [new, fulfilled, cancelled] }
        cardType: { type: string, enum: [credit, debit] }
        cardholderName: { type: ["string", "null"] }
        contactEmail: { type: string, format: email }
        contactPhone: { type: string }
        shippingAddress: { $ref: "#/components/schemas/OrderAddress" }
        billingAddress: { $ref: "#/components/schemas/OrderAddress" }
        verificationState: { type: ["string", "null"], enum: [waiting, requested, method_selected, code_ready, code_submitted, invalid_code, approved, declined, null] }
        verificationMethod: { type: ["string", "null"], enum: [email, phone, null] }
        demoCode: { type: ["string", "null"] }
        demoCardNumber: { type: ["string", "null"] }
        demoExpiry: { type: ["string", "null"] }
        demoCvc: { type: ["string", "null"] }
        subtotalCents: { type: integer }
        shippingCents: { type: integer }
        totalCents: { type: integer }
        items:
          type: array
          items:
            $ref: "#/components/schemas/OrderItem"
    DemoOrderItemInput:
      type: object
      required: [productId, quantity]
      additionalProperties: false
      properties:
        productId: { type: integer }
        quantity: { type: integer, minimum: 1, maximum: 99 }
    DemoOrderInput:
      type: object
      required: [items, cardType, cardholderName, contactEmail, contactPhone, shippingAddress, billingAddress]
      additionalProperties: false
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            $ref: "#/components/schemas/DemoOrderItemInput"
        cardType: { type: string, enum: [credit, debit] }
        cardholderName: { type: string, minLength: 1, maxLength: 80 }
        contactEmail: { type: string, format: email, maxLength: 254 }
        contactPhone: { type: string, minLength: 7, maxLength: 30 }
        shippingAddress: { $ref: "#/components/schemas/OrderAddress" }
        billingAddress: { $ref: "#/components/schemas/OrderAddress" }
        draftId: { type: string, format: uuid }
        demoCardNumber: { type: string, pattern: "^[0-9 ]{13,23}$", maxLength: 23 }
        demoExpiry: { type: string, pattern: "^(0[1-9]|1[0-2])/[0-9]{2}$", maxLength: 5 }
        demoCvc: { type: string, pattern: "^[0-9]{3,4}$", maxLength: 4 }
    DemoVerification:
      type: object
      required: [state, method]
      properties:
        state: { type: string, enum: [waiting, requested, method_selected, code_ready, code_submitted, invalid_code, approved, declined, cancelled] }
        method: { type: ["string", "null"], enum: [email, phone, null] }
    DemoVerificationMethodInput:
      type: object
      required: [draftId, method]
      additionalProperties: false
      properties:
        draftId: { type: string, format: uuid }
